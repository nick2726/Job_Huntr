version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: jobhuntr_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobhuntr_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhuntr_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/internshiphub
      - JWT_SECRET=supersecretjwtkey12345
      - JWT_EXPIRE=30d
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - jobhuntr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobhuntr_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jobhuntr_network

volumes:
  mongodb_data:

networks:
  jobhuntr_network:
    driver: bridge
